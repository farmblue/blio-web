<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blio Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12404A">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" href="/icons/admin-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/admin-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blio Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Mukta:wght@400;600&display=swap">
<link rel="stylesheet" href="/app.css?v=10">
</head>
<body>
<div id="app" class="app adm">
  <header class="top">
    <a href="/admin/" class="brand" aria-label="Blio Admin"><img src="/icons/wordmark-dark.svg" alt="Blio" width="72" height="36"></a>
    <span class="place">Admin</span>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Admin sections" hidden>
    <button data-act="tab" data-v="orders">Orders</button>
    <button data-act="tab" data-v="stock">Stock</button>
    <button data-act="tab" data-v="fish">Fish</button>
    <button data-act="tab" data-v="settings">Settings</button>
  </nav>
</div>
<noscript><p style="padding:24px;color:#ECE6D6">Blio Admin needs JavaScript.</p></noscript>
<script src="/admin.js?v=10"></script>
</body>
</html>
