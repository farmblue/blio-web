<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blio · Preview</title>
<meta name="description" content="A preview of Blio: fresh fish from the Konkan harbours, cleaned in Kolhapur, delivered the same evening. Coming soon.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12404A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  Blio preview: a show-only walkthrough for survey students to show people what Blio is.
  It places no orders, collects no data and talks to no server. All prices and times are examples.
-->
<style>
:root{
  --ground:#12404A; --raised:#195360; --raised-press:#1F606E; --deep:#0C2E35;
  --paper:#ECE6D6; --paper-2:#DCD4BF; --paper-3:#CFC6AE;
  --ink:#12272C; --muted:#4E5C58; --muted-g:#B4C8CA; --body-g:#D3DEDD;
  --action:#C2462A; --fresh:#3E8E5A; --day2:#C98A1B;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --top-h:56px; --tab-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep)}
body{font-family:'Work Sans','Mukta',system-ui,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html[lang="mr"] body{font-family:'Mukta','Work Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
a{color:inherit}
.anton{font-family:'Anton','Mukta',sans-serif;font-weight:400;letter-spacing:-0.01em;text-transform:uppercase}
html[lang="mr"] .anton{font-family:'Mukta',sans-serif;font-weight:700;letter-spacing:0;text-transform:none}
.mr{font-family:'Mukta',sans-serif}
[hidden]{display:none!important}

.app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:var(--ground)}
.top{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:10px;background:var(--ground)}
.top img{height:34px;width:auto;display:block}
.lang{margin-left:auto;display:flex;background:var(--raised);padding:3px;gap:2px}
.lang button{border:0;background:transparent;height:34px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted-g)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.banner{position:absolute;top:calc(var(--top-h) + env(safe-area-inset-top));left:0;right:0;z-index:4;height:30px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--action);color:#fff;font-size:13px;font-weight:600;letter-spacing:.02em}
.main{position:absolute;top:calc(var(--top-h) + 30px + env(safe-area-inset-top));left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.wrap{padding:16px 16px 32px}
.view{animation:enter 280ms var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:6;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:var(--deep);border-top:1px solid var(--raised)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted-g)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--paper)}
.tabs button[aria-current="page"] svg{color:var(--action)}

/* home */
.ticket{background:var(--paper);color:var(--ink)}
.ticket .in{padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px}
.ticket .kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--action)}
html[lang="mr"] .ticket .kick{letter-spacing:0;font-size:15px}
.ticket h1{margin:0;font-size:clamp(44px,13vw,60px);line-height:.9}
html[lang="mr"] .ticket h1{font-size:clamp(36px,10.5vw,48px);line-height:1.1}
.ticket p{margin:0;font-size:17px;line-height:1.45}
.perf{border-top:4px dotted var(--ink);margin:0 16px;opacity:.6}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 20px 20px}
.facts span{display:flex;flex-direction:column;gap:2px}
.facts small{font-size:13px;color:var(--muted)}
.facts strong{font-size:16px;font-weight:600}
.btn{height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--action);color:#fff;font-size:16px;font-weight:600;text-decoration:none;padding:0 18px;width:100%}
.btn.dark{background:var(--raised);color:var(--paper)}
.btn.wa{background:#1F7A4D}
.btn[disabled]{background:var(--paper-3);color:var(--muted);cursor:not-allowed}
.btn:active:not([disabled]){transform:scale(.98)}
h2.sec{margin:36px 0 12px;font-size:34px;line-height:.95}
html[lang="mr"] h2.sec{font-size:28px;line-height:1.15}
.lead{margin:0 0 16px;font-size:16px;line-height:1.5;color:var(--body-g)}
.journey{display:flex;flex-direction:column;gap:0;background:var(--raised);padding:6px 0}
.jrow{display:flex;gap:14px;padding:12px 16px;align-items:flex-start}
.jrow .ic{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--ground)}
.jrow b{display:block;font-size:16px}
.jrow span{display:block;font-size:14px;color:var(--muted-g);margin-top:2px;line-height:1.4}
.end{margin-top:36px;background:var(--paper);color:var(--ink);padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.end h3{margin:0;font-size:30px;line-height:1}
html[lang="mr"] .end h3{font-size:26px;line-height:1.2}
.end p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}

/* catch */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 14px;border:1px solid var(--raised-press);background:transparent;color:var(--paper);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;width:100%;border:0;padding:12px;background:var(--raised);color:var(--paper);text-align:left;align-items:center}
.card:active{background:var(--raised-press)}
.card .art{flex:0 0 84px;height:84px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.card .art svg{width:76px;height:76px}
.card .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .t b{font-size:17px}
.card .t .sub{font-size:13px;color:var(--muted-g)}
.card .src{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--body-g)}
.card .src svg{flex:0 0 14px;width:14px;height:14px;color:var(--action)}
.card .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.price{font-size:16px;font-weight:700;white-space:nowrap}
.price small{font-weight:500;font-size:12px;color:var(--muted-g)}
.demo{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;background:var(--paper-2);color:var(--ink)}
html[lang="mr"] .demo{letter-spacing:0;font-size:12px;text-transform:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;color:#fff;background:var(--fresh);width:max-content}
.badge.d2{background:var(--day2)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}

/* detail */
.back{border:0;background:transparent;display:flex;align-items:center;gap:6px;height:40px;padding:0;margin-bottom:8px;font-size:15px;font-weight:600;color:var(--muted-g)}
.hero{background:var(--paper);display:flex;align-items:center;justify-content:center;height:210px;position:relative}
.hero svg.big{width:230px;height:190px}
.hero .badge{position:absolute;top:12px;left:12px}
.dname{margin:16px 0 2px;font-size:44px;line-height:.95}
html[lang="mr"] .dname{font-size:38px;line-height:1.15}
.dsub{font-size:15px;color:var(--muted-g)}
.dprice{display:flex;align-items:center;gap:10px;margin-top:10px}
.dprice .price{font-size:22px}
.story{margin-top:22px;background:var(--raised);padding:16px}
.story h3{margin:0 0 4px;font-size:22px}
html[lang="mr"] .story h3{font-size:20px}
.story .note{font-size:13px;color:var(--muted-g);margin-bottom:12px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 16px 30px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:6px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--paper)}
.tl li.done::before{background:var(--fresh)}
.tl li.soon::before{background:transparent;border:2px solid var(--paper)}
.tl li::after{content:"";position:absolute;left:11px;top:22px;bottom:-6px;width:2px;background:var(--raised-press)}
.tl li:last-child::after{display:none}
.tl b{display:block;font-size:15px}
.tl span{display:block;font-size:13px;color:var(--muted-g);margin-top:1px}
.tl time{float:right;font-size:13px;font-weight:600;color:var(--paper)}
.fresh-meter{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.fresh-meter .bar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fresh-meter .bar i{height:8px;background:var(--raised-press)}
.fresh-meter .bar i.on{background:var(--fresh)}
.fresh-meter.d2 .bar i.on{background:var(--day2)}
.fresh-meter span{font-size:13px;color:var(--body-g)}
.opt{margin-top:20px}
.opt h4{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted-g)}
.opt .chips{margin-bottom:0;flex-wrap:wrap;overflow:visible}

/* why */
.usps{display:flex;flex-direction:column;gap:10px}
.usp{display:flex;gap:14px;background:var(--raised);padding:16px}
.usp .ic{flex:0 0 48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink)}
.usp b{display:block;font-size:17px}
.usp span{display:block;margin-top:3px;font-size:14px;line-height:1.45;color:var(--body-g)}

/* later */
.lgroup{margin-top:26px}
.lgroup h3{margin:0 0 4px;font-size:24px;line-height:1.05}
html[lang="mr"] .lgroup h3{font-size:21px;line-height:1.2}
.lgroup p{margin:0 0 12px;font-size:14px;color:var(--muted-g)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--raised);padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.tile .art{height:92px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:84px;height:84px}
.tile b{font-size:15px;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted-g);line-height:1.35}
.later-tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper);border:1px solid var(--muted-g);padding:1px 6px;width:max-content}
html[lang="mr"] .later-tag{letter-spacing:0;font-size:12px;text-transform:none}
.fine{margin-top:28px;font-size:12.5px;line-height:1.5;color:var(--muted-g)}
</style>
</head>

    cut: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>',
    shield: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
    cert: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
    scale: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg>',
    hands: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 14l4-4 3 2 3-3 4 1 4 4-6 6H9z"/><path d="M7 10l3-3 3 2"/></svg>',
    moon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg>',
    wa: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg>'
  };

  // ---------- state ----------
  var S = { lang: 'en', view: 'home', group: 'all', item: null, cut: {}, pack: {} };
  try { var saved = localStorage.getItem('blio-preview-lang'); if (saved === 'mr' || saved === 'en') S.lang = saved; } catch (e) {}

  var main = document.getElementById('main');
  function t(k, v) { var s = (T[S.lang][k] != null ? T[S.lang][k] : T.en[k]) || ''; if (v) Object.keys(v).forEach(function (x) { s = s.replace('{' + x + '}', v[x]); }); return s; }
  function mr() { return S.lang === 'mr'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function digits(s) { return mr() ? String(s).replace(/[0-9]/g, function (d) { return '०१२३४५६७८९'[d]; }) : String(s); }
  function hName(h) { return mr() ? HARBOUR[h] : h; }
  function timeTxt(x) { if (!mr()) return x; var p = x.split(' '); return (p[1] === 'AM' ? 'सकाळी ' : 'दुपारी ') + digits(p[0]); }
  function rupees(n) { return '₹' + digits(n.toLocaleString('en-IN')); }
  function fishName(f) { return mr() ? f.mr : f.name; }
  function fishSub(f) { return mr() ? f.name + ' · ' + f.en : f.mr + ' · ' + f.en; }
  function badge(f) { return '<span class="badge' + (f.day === 2 ? ' d2' : '') + '">' + t(f.day === 2 ? 'day2' : 'fresh') + '</span>'; }

  // ---------- views ----------
  function viewHome() {
    return '<div class="wrap view">' +
      '<section class="ticket"><div class="in">' +
        '<span class="kick">' + t('kick') + '</span>' +
        '<h1 class="anton">' + t('h1') + '</h1>' +
        '<p>' + t('intro') + '</p>' +
      '</div><div class="perf"></div>' +
      '<div class="facts">' +
        '<span><small>' + t('f1s') + '</small><strong>' + t('f1') + '</strong></span>' +
        '<span><small>' + t('f2s') + '</small><strong>' + t('f2') + '</strong></span>' +
        '<span><small>' + t('f3s') + '</small><strong>' + t('f3') + '</strong></span>' +
        '<span><small>' + t('f4s') + '</small><strong>' + t('f4') + '</strong></span>' +
      '</div>' +
      '<div style="padding:0 20px 20px"><button class="btn" data-go="catch">' + t('seeCatch') + '</button></div></section>' +
      '<h2 class="sec anton">' + t('jTitle') + '</h2>' +
      '<p class="lead">' + t('jLead') + '</p>' +
      '<div class="journey">' +
        jrow(ICON.anchor, 'j1', 'j1s') + jrow(ICON.truck, 'j2', 'j2s') + jrow(ICON.knife, 'j3', 'j3s') + jrow(ICON.door, 'j4', 'j4s') +
      '</div>' + endCard() + '</div>';
  }
  function jrow(ic, a, b) { return '<div class="jrow"><span class="ic">' + ic + '</span><div><b>' + t(a) + '</b><span>' + t(b) + '</span></div></div>'; }
  function endCard() {
    var waUrl = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t('waMsg'));
    return '<section class="end"><h3 class="anton">' + t('endH') + '</h3><p>' + t('endP') + '</p>' +
      '<a class="btn wa" href="' + waUrl + '" target="_blank" rel="noopener">' + ICON.wa + t('wa') + '</a>' +
      (INSTAGRAM ? '<a class="btn dark" href="' + esc(INSTAGRAM) + '" target="_blank" rel="noopener">' + t('ig') + '</a>' : '') +
      '</section><p class="fine">' + t('fine') + '</p>';
  }

  function viewCatch() {
    var groups = ['all', 'gFish', 'gPrawns', 'gCrab'];
    var list = CATCH.filter(function (f) { return S.group === 'all' || f.g === S.group; });
    return '<div class="wrap view">' +
      '<h2 class="sec anton" style="margin-top:6px">' + t('tCatch') + '</h2>' +
      '<p class="lead">' + t('catchLead') + '</p>' +
      '<div class="chips" role="group">' + groups.map(function (g) { return '<button class="chip" data-group="' + g + '" aria-pressed="' + (S.group === g) + '">' + t(g === 'all' ? 'all' : g) + '</button>'; }).join('') + '</div>' +
      '<div class="cards">' + list.map(function (f) {
        var when = f.day === 2 ? t('landedYday', { t: timeTxt(f.t) }) : t('landedToday', { t: timeTxt(f.t) });
        return '<button class="card" data-item="' + f.id + '">' +
          '<span class="art">' + fishSVG(f.art, f.c) + '</span>' +
          '<span class="t"><b>' + fishName(f) + '</b><span class="sub">' + fishSub(f) + '</span>' +
            '<span class="src">' + ICON.pin + esc(hName(f.h)) + ' · ' + when + '</span>' + badge(f) + '</span>' +
          '<span class="r"><span class="price">' + rupees(f.price) + '<small>' + t('perKg') + '</small></span><span class="demo">' + t('demo') + '</span></span>' +
        '</button>';
      }).join('') + '</div></div>';
  }

  function viewItem() {
    var f = CATCH.filter(function (x) { return x.id === S.item; })[0];
    if (!f) { S.view = 'catch'; return viewCatch(); }
    var cut = S.cut[f.id] || f.cuts[0], pack = S.pack[f.id] || '1 kg';
    var cutLbl = function (c) { return mr() ? CUT[c] || c : c; };
    var packLbl = function (p) { return mr() ? PACK[p] : p; };
    return '<div class="wrap view">' +
      '<button class="back" data-go="catch">' + ICON.back + t('back') + '</button>' +
      '<div class="hero">' + badge(f) + fishSVG(f.art, f.c, 'big') + '</div>' +
      '<h2 class="dname anton">' + fishName(f) + '</h2>' +
      '<div class="dsub">' + fishSub(f) + '</div>' +
      '<div class="dprice"><span class="price">' + rupees(f.price) + '<small>' + t('perKg') + '</small></span><span class="demo">' + t('demo') + '</span></div>' +
      '<section class="story"><h3 class="anton">' + t('story') + '</h3><div class="note">' + t('storyNote') + '</div>' +
        '<ol class="tl">' +
          '<li class="done"><time>' + timeTxt(f.t) + '</time><b>' + t(f.day === 2 ? 's1y' : 's1', { h: esc(hName(f.h)) }) + '</b><span>' + t('s1s') + '</span></li>' +
          '<li class="done"><time>' + timeTxt(f.k) + '</time><b>' + t('s2') + '</b><span>' + t('s2s') + '</span></li>' +
          '<li class="soon"><b>' + t('s3') + '</b><span>' + t('s3s') + '</span></li>' +
          '<li class="soon"><time>' + (mr() ? 'संध्या. ' + digits('5–8') : '5–8 PM') + '</time><b>' + t('s4') + '</b><span>' + t('s4s') + '</span></li>' +
        '</ol>' +
        '<div class="fresh-meter' + (f.day === 2 ? ' d2' : '') + '"><div class="bar"><i class="on"></i><i class="' + (f.day === 2 ? 'on' : '') + '"></i></div>' +
          '<span><b>' + t(f.day === 2 ? 'meterNow2' : 'meterNow1') + '.</b> ' + t('meter') + '</span></div>' +
      '</section>' +
      '<div class="opt"><h4>' + t('cut') + '</h4><div class="chips">' + f.cuts.map(function (c) { return '<button class="chip" data-cut="' + esc(c) + '" aria-pressed="' + (c === cut) + '">' + esc(cutLbl(c)) + '</button>'; }).join('') + '</div></div>' +
      '<div class="opt"><h4>' + t('pack') + '</h4><div class="chips">' + ['500 g', '1 kg'].map(function (p) { return '<button class="chip" data-pack="' + p + '" aria-pressed="' + (p === pack) + '">' + packLbl(p) + '</button>'; }).join('') + '</div></div>' +
      '<div style="margin-top:22px"><button class="btn" disabled>' + t('orderSoon') + '</button></div>' +
    '</div>';
  }

  function viewWhy() {
    var u = [[ICON.eye, 'u1'], [ICON.clock, 'u2'], [ICON.cut, 'u3'], [ICON.shield, 'u4'], [ICON.cert, 'u8'], [ICON.scale, 'u5'], [ICON.hands, 'u6'], [ICON.moon, 'u7']];
    return '<div class="wrap view"><h2 class="sec anton" style="margin-top:6px">' + t('tWhy') + '</h2><p class="lead">' + t('whyLead') + '</p>' +
      '<div class="usps">' + u.map(function (x) { return '<div class="usp"><span class="ic">' + x[0] + '</span><div><b>' + t(x[1]) + '</b><span>' + t(x[1] + 's') + '</span></div></div>'; }).join('') + '</div>' +
      endCard() + '</div>';
  }

  function viewLater() {
    return '<div class="wrap view"><h2 class="sec anton" style="margin-top:6px">' + t('tLater') + '</h2><p class="lead">' + t('laterLead') + '</p>' +
      LATER.map(function (g) {
        return '<section class="lgroup"><h3 class="anton">' + t(g.k) + '</h3><p>' + t(g.k + 'P') + '</p><div class="grid">' +
          g.items.map(function (it) {
            var name = mr() ? it[1] : it[0], sub = it[4] ? (mr() ? it[5] : it[4]) : (mr() ? it[0] : it[1]);
            return '<div class="tile"><span class="art">' + itemSVG(it[2], it[3]) + '</span><b>' + esc(name) + '</b><span>' + esc(sub) + '</span><span class="later-tag">' + t('later') + '</span></div>';
          }).join('') + '</div></section>';
      }).join('') + '<p class="fine">' + t('fine') + '</p></div>';
  }

  // ---------- render ----------
  var TABS = [['home', 'tHome', 'home'], ['catch', 'tCatch', 'fish'], ['why', 'tWhy', 'star'], ['later', 'tLater', 'basket']];
  function render(keepScroll) {
    document.documentElement.lang = S.lang;
    document.getElementById('banner').textContent = t('banner');
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)); });
    var active = S.view === 'item' ? 'catch' : S.view;
    document.getElementById('tabs').innerHTML = TABS.map(function (x) {
      return '<button type="button" data-go="' + x[0] + '"' + (x[0] === active ? ' aria-current="page"' : '') + '>' + ICON[x[2]] + '<span>' + t(x[1]) + '</span></button>';
    }).join('');
    var top = main.scrollTop;
    main.innerHTML = S.view === 'catch' ? viewCatch() : S.view === 'item' ? viewItem() : S.view === 'why' ? viewWhy() : S.view === 'later' ? viewLater() : viewHome();
    main.scrollTop = keepScroll ? top : 0;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button,a'); if (!el) return;
    if (el.dataset.lang) { S.lang = el.dataset.lang; try { localStorage.setItem('blio-preview-lang', S.lang); } catch (x) {} render(true); return; }
    if (el.dataset.go) { S.view = el.dataset.go; render(); return; }
    if (el.dataset.group) { S.group = el.dataset.group; render(true); return; }
    if (el.dataset.item) { S.item = el.dataset.item; S.view = 'item'; render(); return; }
    if (el.dataset.cut) { S.cut[S.item] = el.dataset.cut; render(true); return; }
    if (el.dataset.pack) { S.pack[S.item] = el.dataset.pack; render(true); return; }
  });

  render();
})();
</script>
</body>
</html>
