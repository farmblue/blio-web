<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blio · Fresh seafood in Kolhapur</title>
<meta name="description" content="Fresh fish, prawns and crab bought at the morning auction in Goa and on the Konkan coast. Order by 3 PM for delivery in Kolhapur the same evening.">
<meta name="theme-color" content="#12404A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blio">
<meta property="og:title" content="Blio · Fresh seafood in Kolhapur">
<meta property="og:description" content="Fresh catch from the morning auction. Order by 3 PM, delivered in Kolhapur the same evening.">
<meta property="og:image" content="https://blio.in/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Mukta:wght@400;600&display=swap">
<link rel="stylesheet" href="/app.css?v=12">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <button class="icon-btn press" id="back" aria-label="Back to the catch" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a href="/" class="brand" aria-label="Blio home"><img src="/icons/wordmark-dark.svg" alt="Blio" width="72" height="36"></a>
    <a href="#orders" class="place ordlink" data-act="orders">My orders</a>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
  <button class="slip-bar press" id="slipbar" aria-label="Open your slip"></button>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Item"></div>
  <div class="mapov" id="mapov" role="dialog" aria-modal="true" aria-label="Pin your location" hidden>
    <div class="mapbar">
      <button class="icon-btn press" data-act="mapclose" aria-label="Close the map">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <b>Pin your location</b>
    </div>
    <div class="mapwrap">
      <div id="lmap"></div>
      <svg class="pin" width="40" height="52" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 51C20 51 38 31 38 19A18 18 0 0 0 2 19C2 31 20 51 20 51Z" fill="#C2462A" stroke="#FFFFFF" stroke-width="2.5"/><circle cx="20" cy="19" r="6.5" fill="#FFFFFF"/></svg>
    </div>
    <div class="mapfoot">
      <p id="mapmsg">Move the map so the pin sits on your gate or building.</p>
      <div class="mapbtns">
        <button class="btn dark press" data-act="locate">Use my location</button>
        <button class="btn press" data-act="mapok">Confirm this spot</button>
      </div>
    </div>
  </div>
</div>
<noscript><p style="padding:24px;color:#ECE6D6">Blio needs JavaScript to take orders. You can also order on WhatsApp: +91 88568 88766.</p></noscript>
<script src="/products.js?v=12"></script>
<script src="/app.js?v=12"></script>
</body>
</html>
